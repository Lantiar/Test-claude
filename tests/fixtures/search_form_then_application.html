<!doctype html>
<html><head><title>Job</title></head>
<body>
  <header>
    <!-- The careers site's own search box. It leads the document, and "form"
         leads three of the four form_selector lists. -->
    <form><input aria-label="Search jobs"><button type="submit">Search</button></form>
  </header>
  <main>
    <div>First Name</div><input aria-label="First Name">
    <div>Last Name</div><input aria-label="Last Name">
    <div>Email</div><input aria-label="Email" type="email">
    <div>Cover letter</div><textarea aria-label="Cover letter"></textarea>
    <button type="submit">Submit</button>
  </main>
</body></html>
