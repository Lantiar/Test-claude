<!doctype html>
<html><head><title>Application</title></head>
<body><form>
  <label for="fn">First Name</label><input id="fn" name="fn">
  <!-- TikTok serves this already ticked, and the input is driven by the
       wrapper span rather than by its own checked property. -->
  <div>
    <span class="atsx-checkbox atsx-checkbox-checked">
      <input id="pp" type="checkbox" class="atsx-checkbox-input" value="" checked>
    </span>
    <span>I have read and agreed to the Privacy Policy</span>
  </div>
  <button type="submit">Submit</button>
</form></body></html>
