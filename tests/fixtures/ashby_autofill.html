<!doctype html>
<html><head><title>Application</title></head>
<body>
  <form>
    <div role="presentation" class="ashby-application-form-autofill-input-root">
      <input type="file" accept=".pdf,.doc,.docx">
      <div>Autofill from resume</div>
      <div>Upload your resume here to autofill key application fields.</div>
      <button type="button">Upload file</button>
    </div>
    <div>Full Name</div>
    <input id="_systemfield_name" aria-label="Full Name">
    <div>Email</div>
    <input id="_systemfield_email" type="email" aria-label="Email">
    <div>Are you authorized to work in the US?</div>
    <input id="wa" aria-label="Are you authorized to work in the US?">
    <div class="ashby-application-form-input-file">
      <input id="_systemfield_resume" type="file" accept=".pdf,.doc,.docx"
             aria-label="Resume">
      <div>Upload File or drag and drop here</div>
    </div>
    <button type="submit">Submit</button>
  </form>
</body></html>
