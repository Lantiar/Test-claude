<!doctype html>
<html><head><title>Application</title></head>
<body><form>
  <label for="fn">First Name</label><input id="fn">
  <label for="ln">Last Name</label><input id="ln">
  <label for="rs">Resume</label><input id="rs" type="file">
  <!-- What a Greenhouse board runs by default: enterprise reCAPTCHA scoring
       the session in the background. It asks nobody anything. -->
  <div class="grecaptcha-badge" style="width:256px;height:60px">
    <div class="grecaptcha-logo">
      <iframe title="reCAPTCHA" style="width:256px;height:60px"
        src="https://www.recaptcha.net/recaptcha/enterprise/anchor?ar=1&k=x"></iframe>
    </div>
  </div>
  <button type="submit">Submit</button>
</form></body></html>
