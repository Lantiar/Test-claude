name: jobfeed

# Hourly, because Instagram stories expire after 24 hours and a missed one is
# missed permanently. Simplify is free and ETag-cached, so the only per-run
# cost is the stories actor, billed at $0.015.
on:
  schedule:
    - cron: "7 * * * *"      # :07 rather than :00 -- GitHub queues the top of
                             # the hour heavily and delays scheduled runs
  workflow_dispatch:

concurrency:
  # Never two at once: they would race on the same database and each would
  # write a first_seen_at the other did not know about.
  group: jobfeed
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # to commit the snapshot back
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jobfeed-data
          fetch-depth: 1
        continue-on-error: true

      - name: Start the data branch if it does not exist yet
        run: |
          git rev-parse --verify HEAD >/dev/null 2>&1 || {
            git checkout --orphan jobfeed-data
            git rm -rf . >/dev/null 2>&1 || true
          }

      - uses: actions/checkout@v4
        with:
          path: code

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The working database, kept between runs. A cache is the right shape for
      # it -- rebuildable, not precious -- but it can be evicted, so the branch
      # holds a text snapshot that survives independently.
      - name: Restore the database
        uses: actions/cache@v4
        with:
          path: data
          key: jobfeed-db-${{ github.run_id }}
          restore-keys: jobfeed-db-

      - name: Poll
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          IG_TARGET: ${{ vars.IG_TARGET || 'zero2sudo' }}
          JOBFEED_DB: ${{ github.workspace }}/data/jobfeed.sqlite3
        run: |
          cd code
          python -m jobfeed.cli run --retire
          python -m jobfeed.cli publish --out "$GITHUB_WORKSPACE/site"
          python -m jobfeed.cli export --out "$GITHUB_WORKSPACE/site/jobs.jsonl"
          python -m jobfeed.cli stats

      # Published to a branch rather than through the Pages deploy action so
      # the same commit is both the served site and the durable backup: if the
      # build cache is evicted, first_seen_at survives here, and it is the one
      # field that cannot be reconstructed by refetching.
      - name: Publish
        run: |
          cp -f site/*.json site/jobs.jsonl . 2>/dev/null || true
          rm -rf site
          # Tells Pages to serve these files as-is rather than running Jekyll,
          # which would ignore anything it did not recognise.
          touch .nojekyll
          git config user.name  "jobfeed"
          git config user.email "jobfeed@users.noreply.github.com"
          git add -A .
          git diff --cached --quiet || git commit -m "jobfeed: $(date -u +%Y-%m-%dT%H:%M)Z"
          git push origin HEAD:jobfeed-data
