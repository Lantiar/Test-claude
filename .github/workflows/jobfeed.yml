name: jobfeed

# Every half hour. Instagram stories expire after 24 hours, so the cadence is
# about how fresh new links are rather than about losing them; 30 minutes is
# the fastest that stays inside the Apify credit, at a measured $0.01505 a run
# ($21.67 a month against a $29 allowance). Simplify is a raw GitHub file with
# ETag caching and costs nothing at any frequency.
#
# GitHub's own schedule is kept as a fallback and is not trusted as the primary
# trigger: it is best-effort, it skipped the first several slots after this was
# added, and a scheduler that silently does not fire is the worst kind for a
# source with an expiry. An external trigger calls workflow_dispatch instead --
# see jobfeed/README.md. The guard below makes it safe for both to fire.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if the last run was recent"
        required: false
        default: "yes"

concurrency:
  # Two at once would each publish a snapshot without the other's findings,
  # and the loser's story links would be gone for good.
  group: jobfeed
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The published snapshot is the store, not a backup of one. The runner is
      # stateless and a build cache was the wrong place for the database:
      # Simplify refetches in a second, but a story link is unreachable a day
      # later, so losing the cache would delete exactly the jobs that cannot be
      # re-derived -- and the run afterwards would look perfectly healthy.
      # Absent on the very first run, which is why nothing here is fatal.
      - name: Fetch the last snapshot
        id: previous
        run: |
          git fetch --depth=1 origin jobfeed-data 2>/dev/null \
            && git show FETCH_HEAD:jobs.json > previous.json \
            || echo "no previous snapshot yet (first run)"
          git show FETCH_HEAD:meta.json > previous_meta.json 2>/dev/null || true
          ls -la previous.json 2>/dev/null || true

      # Two triggers now point at this workflow -- GitHub's schedule and an
      # external caller -- and the expensive half of a run is a paid API call.
      # Rather than police which one is allowed to fire, refuse to do the work
      # twice in quick succession whatever asked. A manual run says so and is
      # always allowed through, since that is someone deliberately asking.
      - name: Skip if the last run was recent
        id: guard
        env:
          MIN_MINUTES: ${{ vars.JOBFEED_MIN_MINUTES || 20 }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.force }}" ]; then
            echo "manual run, going ahead"; exit 0
          fi
          [ -f previous_meta.json ] || { echo "no previous run to compare against"; exit 0; }
          AGE=$(python3 -c "import json,time;print(int((time.time()-json.load(open('previous_meta.json'))['generated_at_epoch'])//60))" 2>/dev/null || echo 999)
          echo "the last publish was $AGE minutes ago (minimum gap $MIN_MINUTES)"
          if [ "$AGE" -lt "$MIN_MINUTES" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "too soon -- not polling"
          fi

      # No setup-python and no pip: jobfeed is pure standard library, and the
      # runner's python3 is all it needs.
      - name: Poll and publish
        if: steps.guard.outputs.skip != 'true'
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          IG_TARGET: ${{ vars.IG_TARGET || 'zero2sudo' }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ vars.NOTIFY_TO }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          JOBFEED_DB: ${{ runner.temp }}/jobfeed.sqlite3
        run: |
          set -e
          python3 --version
          [ -f previous.json ] && python3 -m jobfeed.cli seed previous.json
          python3 -m jobfeed.cli run --retire
          # Mail whatever is new, before publishing, so the watermark the
          # notifier moves is the one that gets written into meta.json and
          # survives the next rebuild. Never fatal: a mail that does not go
          # out is worth knowing about, and is not a reason to throw away a
          # poll that worked.
          [ -f previous_meta.json ] && WM="--watermark-from previous_meta.json" || WM=""
          python3 -m jobfeed.cli notify $WM || echo "::warning::the new-posting mail did not go out"
          python3 -m jobfeed.cli publish --out site
          python3 -m jobfeed.cli export --out site/jobs.jsonl
          python3 -m jobfeed.cli stats
          # Serve the files as they are; Jekyll would ignore anything it did
          # not recognise.
          touch site/.nojekyll

      # Recruiter outreach, and only for jobs whose button was pressed on the
      # tracker. Separate from the poll above so a failure here cannot cost a
      # publish: the feed is the thing that must not miss a run, and the
      # outreach board is asked again in half an hour either way.
      #
      # OUTREACH_SEND is the kill switch. Unset, this drafts and schedules but
      # sends nothing, which is what a first deployment should do -- set it to
      # 1 in the repository variables once you have read a batch and want the
      # button to actually put mail out.
      - name: Recruiter outreach
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          OUTREACH_FROM: ${{ vars.OUTREACH_FROM }}
          OUTREACH_BRACKET: ${{ vars.OUTREACH_BRACKET }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          JOBFEED_DB: ${{ runner.temp }}/jobfeed.sqlite3
        run: |
          if [ -z "$KV_REST_API_URL" ]; then
            echo "::notice::no Upstash credentials, so the outreach board was not read"
            exit 0
          fi
          if [ "${{ vars.OUTREACH_SEND }}" = "1" ]; then
            python3 -m jobfeed.cli outreach board --send
          else
            echo "OUTREACH_SEND is not 1: drafting and scheduling only, nothing sent"
            python3 -m jobfeed.cli outreach board
          fi

      # A fresh single-commit branch each time, rather than a growing history
      # of megabyte snapshots. Nothing is lost by that: every snapshot is
      # complete, including each job's original first_seen_at, so the newest
      # one is the whole state.
      - name: Publish to the data branch
        if: steps.guard.outputs.skip != 'true'
        run: |
          cd site
          git init -q
          git config user.name  "jobfeed"
          git config user.email "jobfeed@users.noreply.github.com"
          git add -A
          git commit -qm "jobfeed: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" \
            HEAD:jobfeed-data
