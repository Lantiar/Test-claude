<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jobfeed</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f5f4f'/%3E%3Cpath d='M9 21V11h3v7h5v3H9z' fill='%23fff'/%3E%3C/svg%3E">
<meta name="description" content="Internship postings from SimplifyJobs and Instagram stories, deduplicated and refreshed hourly.">
<style>
:root{
  --bg:#fbfaf8; --panel:#fff; --line:#e6e2dc; --ink:#1c1a17; --dim:#6d675f;
  --accent:#1f5f4f; --accent-soft:#e7f0ec;
  --s-applied:#3b6ea5; --s-oa:#7a5ea8; --s-interview:#b06d1f;
  --s-final:#a2531d; --s-offer:#1f7a4d; --s-accepted:#146b3a; --s-rejected:#8b3a3a;
  --s-interested:#6d675f;
  --t-s:#8a6212; --t-s-line:#e3d4ac; --t-s-bg:#faf3e2;
  --t-a:#1f5f4f; --t-a-line:#bcd8ce; --t-a-bg:#eaf3ef;
  --t-b:#5b6470; --t-b-line:#d7dbe0; --t-b-bg:#f1f3f5;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#14140f; --panel:#1c1c17; --line:#2f2e28; --ink:#eeece6; --dim:#9a948a;
  --accent:#6fbfa4; --accent-soft:#1d2f29;
  --s-applied:#7aa7d8; --s-oa:#b39ae0; --s-interview:#e0a95e; --s-final:#e08f52;
  --s-offer:#5fc48c; --s-accepted:#4fbd7d; --s-rejected:#e08585; --s-interested:#9a948a;
  --t-s:#d8b263; --t-s-line:#4a3c1c; --t-s-bg:#2a2312;
  --t-a:#6fbfa4; --t-a-line:#274038; --t-a-bg:#152520;
  --t-b:#98a2ae; --t-b-line:#333a42; --t-b-bg:#1c2026;
}}
:root[data-theme="dark"]{
  --bg:#14140f; --panel:#1c1c17; --line:#2f2e28; --ink:#eeece6; --dim:#9a948a;
  --accent:#6fbfa4; --accent-soft:#1d2f29;
  --s-applied:#7aa7d8; --s-oa:#b39ae0; --s-interview:#e0a95e; --s-final:#e08f52;
  --s-offer:#5fc48c; --s-accepted:#4fbd7d; --s-rejected:#e08585; --s-interested:#9a948a;
  --t-s:#d8b263; --t-s-line:#4a3c1c; --t-s-bg:#2a2312;
  --t-a:#6fbfa4; --t-a-line:#274038; --t-a-bg:#152520;
  --t-b:#98a2ae; --t-b-line:#333a42; --t-b-bg:#1c2026;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);
  border-bottom:1px solid var(--line);padding:14px 20px 10px}
h1{margin:0 0 2px;font-size:17px;letter-spacing:-.01em}
h1 span{color:var(--dim);font-weight:400}
.meta{color:var(--dim);font-size:12.5px}
.stale{color:#b06d1f;font-weight:600}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
input[type=search],select{background:var(--panel);color:var(--ink);
  border:1px solid var(--line);border-radius:7px;padding:6px 9px;font:inherit;font-size:13px}
input[type=search]{min-width:230px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.pills{display:flex;flex-wrap:wrap;gap:5px;margin-left:auto}
.pill{border:1px solid var(--line);background:var(--panel);color:var(--dim);
  border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;font:inherit;font-size:12px}
.pill[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.wrap{padding:0 20px 60px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--dim);font-weight:600;padding:12px 10px 7px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--bg)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:hover td{background:var(--panel)}
.date{white-space:nowrap;color:var(--dim);font-variant-numeric:tabular-nums;font-size:12.5px}
.est{opacity:.65}
.co{font-weight:600}
a.title{color:var(--ink);text-decoration:none}
a.title:hover{color:var(--accent);text-decoration:underline}
.sub{color:var(--dim);font-size:12px;margin-top:2px}
.tag{display:inline-block;border:1px solid var(--line);border-radius:4px;
  padding:0 5px;font-size:10.5px;color:var(--dim);margin-right:4px}
select.stage{min-width:118px;font-size:12.5px}
select.stage[data-set="1"]{border-color:currentColor;font-weight:600}
.s-interested{color:var(--s-interested)} .s-applied{color:var(--s-applied)}
.s-oa{color:var(--s-oa)} .s-interview{color:var(--s-interview)}
.s-final{color:var(--s-final)} .s-offer{color:var(--s-offer)}
.s-accepted{color:var(--s-accepted)} .s-rejected{color:var(--s-rejected)}

/* Outreach sits beside the stage, not inside it: a job is "applied" whether or
   not you have written to anyone, and folding the two into one control would
   lose the stage the moment outreach moved on. */
.reach{display:inline-flex;align-items:center;gap:5px;margin-left:6px;
  font-size:11.5px;font-family:inherit;border:1px solid var(--line);
  background:var(--card);color:var(--fg);border-radius:5px;padding:3px 8px;
  cursor:pointer;white-space:nowrap;vertical-align:middle}
.reach:hover:not(:disabled){border-color:var(--s-applied);color:var(--s-applied)}
.reach:disabled{cursor:default;opacity:.85}
.reach:focus-visible{outline:2px solid var(--s-applied);outline-offset:1px}
.reach.queued{color:var(--s-oa);border-color:var(--s-oa)}
.reach.reached{color:var(--s-applied);border-color:var(--s-applied);font-weight:600}
.reach.replied{color:var(--s-offer);border-color:var(--s-offer);font-weight:700}
.reach.held,.reach.failed{color:var(--s-rejected);border-color:var(--s-rejected)}
a.reach{text-decoration:none}

.tier{display:inline-flex;align-items:center;justify-content:center;
  width:17px;height:17px;border-radius:4px;font-size:10.5px;font-weight:700;
  letter-spacing:0;margin-right:6px;vertical-align:1px;
  border:1px solid;font-variant-numeric:normal}
.tier-S{color:var(--t-s);border-color:var(--t-s-line);background:var(--t-s-bg)}
.tier-A{color:var(--t-a);border-color:var(--t-a-line);background:var(--t-a-bg)}
.tier-B{color:var(--t-b);border-color:var(--t-b-line);background:var(--t-b-bg)}
.empty{padding:50px 10px;text-align:center;color:var(--dim)}
footer{padding:0 20px 40px;color:var(--dim);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>jobfeed <span id="count"></span></h1>
  <div class="meta" id="age">loading…</div>
  <div class="meta" id="meta"></div>
  <div class="bar">
    <input type="search" id="q" placeholder="company, title, location…" autocomplete="off">
    <select id="season"><option value="">any season</option></select>
    <select id="source"><option value="">any source</option></select>
    <select id="tier"><option value="">any tier</option><option value="S">S-tier</option><option value="A">A-tier</option><option value="B">B-tier</option><option value="SAB">S, A or B</option></select>
    <select id="sort">
      <option value="posted">newest posted</option>
      <option value="added">newest to the feed</option>
      <option value="company">by company</option>
    </select>
    <div class="pills" id="pills"></div>
  </div>
</header>
<div class="wrap">
  <table>
    <thead><tr>
      <th style="width:96px" id="datehead">Posted</th><th style="width:170px">Company</th>
      <th>Role</th><th style="width:180px">Where</th><th style="width:130px">Stage</th>
    </tr></thead>
    <tbody id="body"></tbody>
  </table>
  <div class="empty" id="empty" hidden>Nothing matches those filters.</div>
</div>
<footer>A <b>~</b> date is when this feed first saw the job, not when the employer
posted it. <span id="mode">Checking where stages are saved…</span>
The job data refreshes hourly.</footer>

<script>
const $ = s => document.querySelector(s);
let JOBS = [], STAGES = [], filter = {q:"", season:"", source:"", stage:"", tier:""};
// key -> {state, at, note, thread, sent}. Written by the runner, read here.
let REACH = {};
let sortBy = "posted";

// The published file already arrives newest-posted first, with first_seen and
// then name breaking the ties, so "posted" needs no work. The others re-sort a
// copy and keep the same tiebreaks, so a change of view never leaves two runs
// disagreeing about the order of two jobs.
function sorted(list){
  const byName = (a,b) => (a.company||"").localeCompare(b.company||"")
                       || (a.title||"").localeCompare(b.title||"");
  // To the minute, for the same reason the published order is: below that,
  // first_seen records which row an ingest wrote first, which says nothing
  // about the job.
  if(sortBy === "added")
    return [...list].sort((a,b) =>
      Math.floor((b.first_seen_epoch||0)/60) - Math.floor((a.first_seen_epoch||0)/60)
      || byName(a,b));
  if(sortBy === "company")
    return [...list].sort((a,b) => byName(a,b) || (b.posted_at||0) - (a.posted_at||0));
  return list;
}

const fmt = ts => ts ? new Date(ts*1000).toISOString().slice(0,10) : "—";

const STAGE_KEY = "jobfeed.stages.v1";
const PASS_KEY = "jobfeed.pass.v1";
// Central when there is an API beside this page, local when there is not.
// The same file is served from GitHub Pages, which has no write path at all,
// so absence is an expected state rather than a failure -- and the footer says
// which mode is in force, because a tracker that silently keeps your stages
// somewhere other than you think is worse than one that cannot keep them.
let CENTRAL = false;
// Stages live in this browser and nowhere else. The data beside them is
// public -- anyone with the URL reads the same jobs.json -- and where someone
// has applied is not. It never goes over the wire, which also means it does
// not follow them to another device; the local viewer, backed by the
// database, is the one that does.
function localStages(){
  try { return JSON.parse(localStorage.getItem(STAGE_KEY) || "{}"); }
  catch(e){ return {}; }        // private window, cleared storage, blocked
}
function saveLocal(key, stage){
  try {
    const all = localStages();
    if(stage) all[key] = stage; else delete all[key];
    localStorage.setItem(STAGE_KEY, JSON.stringify(all));
    return true;
  } catch(e){ return false; }
}

function passphrase(){
  try { return localStorage.getItem(PASS_KEY) || ""; } catch(e){ return ""; }
}
function rememberPassphrase(p){
  try { localStorage.setItem(PASS_KEY, p); } catch(e){}
}

// Returns "" on success, or a sentence explaining what stopped it.
async function saveStage(key, stage){
  if(!CENTRAL){
    return saveLocal(key, stage) ? ""
      : "This browser will not let the page store anything, so the stage "
      + "cannot be kept. Private windows and blocked site data do this.";
  }
  let pass = passphrase();
  if(!pass){
    pass = window.prompt("Passphrase for saving stages:") || "";
    if(!pass) return "No passphrase given, so nothing was saved.";
    rememberPassphrase(pass);
  }
  let r;
  try {
    r = await fetch("./api/stages", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({key, stage, passphrase: pass})});
  } catch(e){
    return "Could not reach the store, so the stage was not saved.";
  }
  if(r.status === 401){
    try { localStorage.removeItem(PASS_KEY); } catch(e){}
    return "That passphrase was not right. Try the change again.";
  }
  if(!r.ok){
    const d = await r.json().catch(() => ({}));
    return d.detail || d.error || `The store refused that (${r.status}).`;
  }
  saveLocal(key, stage);      // a local echo, so a reload is instant offline
  return "";
}

// A run can finish minutes after the click, and a tracker that only updates on
// reload is one you learn not to trust.
async function pollOutreach(){
  if(!CENTRAL) return;
  try {
    const r = await fetch("./api/outreach", {cache:"no-store"});
    if(!r.ok) return;
    const next = (await r.json()).outreach || {};
    if(JSON.stringify(next) !== JSON.stringify(REACH)){ REACH = next; render(); }
  } catch(e){}
}
setInterval(pollOutreach, 60000);

async function load(){
  let jobs, meta;
  try {
    [jobs, meta] = await Promise.all([
      fetch("./jobs.json", {cache:"no-store"}).then(r => r.json()),
      fetch("./meta.json", {cache:"no-store"}).then(r => r.json()),
    ]);
  } catch(e){
    document.querySelector("#meta").innerHTML =
      '<span class="stale">Could not load the feed.</span> ' +
      'It publishes to jobs.json beside this page.';
    return;
  }
  // The central store if this deployment has one, otherwise this browser's.
  let mine = localStages();
  try {
    try {
      const o = await fetch("./api/outreach", {cache:"no-store"});
      if(o.ok) REACH = (await o.json()).outreach || {};
    } catch(e){ REACH = {}; }        // no endpoint on GitHub Pages; fine
    const r = await fetch("./api/stages", {cache:"no-store"});
    if(r.ok){
      const d = await r.json();
      CENTRAL = true;
      mine = d.stages || {};
    }
  } catch(e){ /* no API here: GitHub Pages serves the page and no functions */ }
  setMode();
  JOBS = jobs.map(j => ({...j,
    key: j.ats_key || j.url_key || j.url,
    posted_at: j.posted_at_epoch,
    stage: mine[j.ats_key || j.url_key || j.url] || "",
    locations: j.locations || [], sources: j.sources || []}));
  STAGES = ["interested","applied","oa","interview","final","offer",
            "accepted","rejected"];
  showAge(meta);
  buildControls({counts: countStages()});
  render();
}

function job_previous(key){
  const j = JOBS.find(x => x.key === key);
  return j ? (j.stage || "") : "";
}

function setMode(){
  const el = document.querySelector("#mode");
  if(!el) return;
  el.textContent = CENTRAL
    ? "Stages are saved centrally — the same on every device."
    : "Stages are kept in this browser only; this copy has no central store.";
}

function countStages(){
  const c = {};
  for(const j of JOBS) if(j.stage) c[j.stage] = (c[j.stage]||0) + 1;
  return c;
}

// How old the data is, said plainly. Stories expire after 24 hours, so a
// stalled feed is losing links rather than merely going out of date, and a
// page that quietly shows yesterday's list is worse than one that admits it.
function showAge(meta){
  const mins = (Date.now()/1000 - meta.generated_at_epoch) / 60;
  const when = mins < 90 ? Math.round(mins) + " min ago"
             : Math.round(mins/60) + " h ago";
  const stale = mins > 150;
  document.querySelector("#age").innerHTML =
    (stale ? '<span class="stale">updated ' + when + '</span>'
           : "updated " + when) +
    " · " + meta.counts.open_jobs.toLocaleString() + " open";
}

function buildControls(d){
  const seasons = [...new Set(JOBS.map(j=>j.season).filter(Boolean))].sort();
  $("#season").innerHTML = '<option value="">any season</option>' +
    seasons.map(s=>`<option>${s}</option>`).join("");
  const srcs = [...new Set(JOBS.flatMap(j=>j.sources))].sort();
  $("#source").innerHTML = '<option value="">any source</option>' +
    srcs.map(s=>`<option>${s}</option>`).join("");
  $("#pills").innerHTML = ["", ...STAGES].map(s =>
    `<button class="pill" data-stage="${s}" aria-pressed="${s===filter.stage}">
       ${s || "all"}${d.counts[s] ? " " + d.counts[s] : ""}</button>`).join("");
  $("#pills").onclick = e => {
    const b = e.target.closest(".pill"); if(!b) return;
    filter.stage = b.dataset.stage; 
    [...$("#pills").children].forEach(p =>
      p.setAttribute("aria-pressed", p.dataset.stage === filter.stage));
    render();
  };
}

function matches(j){
  if(filter.season && j.season !== filter.season) return false;
  if(filter.source && !j.sources.includes(filter.source)) return false;
  if(filter.tier === "SAB"){ if(!j.tier) return false; }
  else if(filter.tier && j.tier !== filter.tier) return false;
  if(filter.stage && j.stage !== filter.stage) return false;
  if(filter.q){
    const hay = (j.company+" "+j.title+" "+j.locations.join(" ")).toLowerCase();
    if(!filter.q.toLowerCase().split(/\s+/).every(w => hay.includes(w))) return false;
  }
  return true;
}

function render(){
  const shown = sorted(JOBS.filter(matches));
  $("#count").textContent = `${shown.length.toLocaleString()} of ${JOBS.length.toLocaleString()}`;
  const tracked = JOBS.filter(j=>j.stage).length;
  $("#meta").innerHTML = `${tracked} tracked · ${JOBS.length.toLocaleString()} open postings`;
  $("#empty").hidden = shown.length > 0;
  $("#datehead").textContent = sortBy === "added" ? "Added" : "Posted";
  $("#body").innerHTML = shown.slice(0, 600).map(j => `
    <tr>
      <td class="date ${sortBy!=="added" && j.posted_is_estimate ? "est" : ""}" title="${
        sortBy==="added" ? "posted " + (j.posted_is_estimate?"~":"") + fmt(j.posted_at)
                         : "reached the feed " + fmt(j.first_seen_epoch)}">${
        sortBy==="added" ? fmt(j.first_seen_epoch)
                         : (j.posted_is_estimate ? "~" : "") + fmt(j.posted_at)}</td>
      <td class="co">${j.tier ? `<span class="tier tier-${j.tier}" title="${j.tier}-tier">${j.tier}</span>` : ""}${esc(j.company)}</td>
      <td>
        <a class="title" href="${esc(j.url||"#")}" target="_blank" rel="noopener">${esc(j.title)}</a>
        <div class="sub">${j.season ? `<span class="tag">${esc(j.season)}</span>` : ""}
          ${j.ats ? `<span class="tag">${esc(j.ats)}</span>` : ""}
          ${j.sources.map(s=>`<span class="tag">${esc(s)}</span>`).join("")}</div>
      </td>
      <td class="sub">${esc(j.locations.join(", ") || "—")}</td>
      <td><select class="stage s-${j.stage||"interested"}" data-set="${j.stage?1:0}" data-key="${esc(j.key)}">
        <option value="">—</option>
        ${STAGES.map(s=>`<option value="${s}" ${s===j.stage?"selected":""}>${s}</option>`).join("")}
      </select>${reachControl(j)}</td>
    </tr>`).join("");
  if(shown.length > 600)
    $("#body").insertAdjacentHTML("beforeend",
      `<tr><td colspan="5" class="sub" style="padding:14px 10px">
        Showing the first 600. Narrow the filters to see the rest.</td></tr>`);
}

// Only for jobs you have actually applied to: the mail says you applied, so
// offering it before that is offering to send something untrue.
const REACHABLE = ["applied","oa","interview","final","offer","accepted"];

function reachControl(j){
  if(!CENTRAL || !REACHABLE.includes(j.stage||"")) return "";
  const r = REACH[j.key] || {};
  const title = esc(r.note || "");
  if(r.state === "replied")
    return r.thread
      ? `<a class="reach replied" target="_blank" rel="noopener" title="${title}"
            href="https://mail.google.com/mail/u/0/#all/${esc(r.thread)}">replied ↗</a>`
      : `<span class="reach replied" title="${title}">replied</span>`;
  if(r.state === "reached")
    return r.thread
      ? `<a class="reach reached" target="_blank" rel="noopener"
            title="${title || "opens the thread in Gmail"}"
            href="https://mail.google.com/mail/u/0/#all/${esc(r.thread)}">reached out ↗</a>`
      : `<span class="reach reached" title="${title}">reached out</span>`;
  if(r.state === "queued")
    return `<button class="reach queued" disabled title="waiting for the next run">queued…</button>`;
  if(r.state === "held" || r.state === "failed")
    return `<button class="reach ${r.state}" data-reach="${esc(j.key)}"
              title="${title || "it did not go; press to ask again"}">${r.state} ↻</button>`;
  return `<button class="reach" data-reach="${esc(j.key)}"
            title="write to recruiters at ${esc(j.company)}">▶ reach out</button>`;
}

function esc(s){ return String(s??"").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

document.addEventListener("click", async e => {
  const btn = e.target.closest("button.reach[data-reach]"); if(!btn) return;
  const key = btn.dataset.reach;
  let pass = passphrase();
  if(!pass){
    pass = window.prompt("Passphrase for saving:") || "";
    if(!pass) return;
    rememberPassphrase(pass);
  }
  btn.disabled = true;
  const was = btn.textContent;
  btn.textContent = "asking…";
  let r;
  try {
    r = await fetch("./api/outreach", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({key, passphrase: pass})});
  } catch(err){
    btn.disabled = false; btn.textContent = was;
    return alert("Could not reach the store, so nothing was requested.");
  }
  if(r.status === 401){
    try { localStorage.removeItem(PASS_KEY); } catch(err){}
    btn.disabled = false; btn.textContent = was;
    return alert("That passphrase was not right.");
  }
  if(!r.ok && r.status !== 409){
    const d = await r.json().catch(() => ({}));
    btn.disabled = false; btn.textContent = was;
    return alert(d.detail || d.error || `The store refused that (${r.status}).`);
  }
  // Recorded, not sent. The runner does the work on its next pass, so the
  // honest label is the one that says it is waiting.
  REACH[key] = {state:"queued", at: Math.floor(Date.now()/1000)};
  render();
});

document.addEventListener("change", async e => {
  const sel = e.target.closest("select.stage"); if(!sel) return;
  const key = sel.dataset.key, stage = sel.value;
  sel.className = "stage s-" + (stage || "interested");
  sel.dataset.set = stage ? 1 : 0;
  const problem = await saveStage(key, stage);
  if(problem){
    sel.value = job_previous(key);          // put the control back
    sel.className = "stage s-" + (sel.value || "interested");
    sel.dataset.set = sel.value ? 1 : 0;
    alert(problem);
    return;
  }
  const job = JOBS.find(j=>j.key===key); if(job) job.stage = stage;
  const counts = countStages();
  [...$("#pills").children].forEach(p => {
    const n = counts[p.dataset.stage];
    p.textContent = (p.dataset.stage || "all") + (n ? " " + n : "");
  });
  $("#meta").innerHTML = `${JOBS.filter(j=>j.stage).length} tracked · ${JOBS.length.toLocaleString()} open postings`;
});

$("#q").oninput = e => { filter.q = e.target.value; render(); };
$("#season").onchange = e => { filter.season = e.target.value; render(); };
$("#source").onchange = e => { filter.source = e.target.value; render(); };
$("#tier").onchange = e => { filter.tier = e.target.value; render(); };
$("#sort").onchange = e => { sortBy = e.target.value; render(); };
load();
</script>
</body>
</html>
